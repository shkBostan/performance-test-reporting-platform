server:
  port: 8090

spring:
  datasource:
    url: jdbc:h2:mem:perf_load_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    io.github.yourusername.perfdemo: DEBUG
    org.springframework.orm: INFO
    org.hibernate: WARN

spring.task.execution:
  pool:
    core-size: 2
    max-size: 5
    queue-capacity: 100
  thread-name-prefix: report-saver-